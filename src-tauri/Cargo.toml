[package]
name = "telepathy"
version = "0.1.0"
description = "A local-first AI knowledge base app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "temp_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
# llama-cpp-4: features are target-specific (Cargo target features are additive,
# so we declare it only in the target sections below to keep Linux off Vulkan).
futures-util = "0.3.32"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
pdf-extract = "0.7"
encoding_rs = "0.8"
base64 = "0.22"
chrono = "0.4"
dirs = "5"
zip = "0.6"
sysinfo = "0.32"
tokio-util = "0.7"
url = "2.5.8"
tauri-plugin-hwinfo = "0.2.3"
tauri-plugin-process = "2"

regex = "1.12.3"
once_cell = "1.21.4"
urlencoding = "2.1.3"
async-trait = "0.1.89"
cxx = "1.0"
usearch = "0.12"
image = "0.25.10"
calamine = "0.24.0"
quick-xml = "0.31.0"

# llama-cpp-4 is intentionally declared only in target-specific sections
# because Cargo target-dep features are additive and cannot override [dependencies].
# macOS keeps the full feature set (mtmd + metal + vulkan + openmp).
# Windows and Linux skip `vulkan`:
#   - Linux: CI runner (ubuntu-22.04) has no /dev/fuse for linuxdeploy.
#   - Windows: llama-cpp-sys-4 build.rs panics if Vulkan SDK is missing
#              (would need to install Vulkan SDK = ~500MB + ~2min CI time).
# Both platforms fall back to OpenMP CPU parallel as the only acceleration.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-4 = { version = "0.3", features = ["mtmd", "metal", "vulkan", "openmp"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-4 = { version = "0.3", features = ["mtmd", "openmp"] }
